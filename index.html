<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur TV NEWS - Néon Rose</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff10f0;
            --neon-purple: #9d00ff;
            --dark-bg: #0a0a0f;
            --card-bg: rgba(20, 20, 35, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 16, 240, 0.1), rgba(157, 0, 255, 0.1));
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink);
            animation: neon-glow 2s infinite alternate;
        }

        @keyframes neon-glow {
            from { text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink); }
            to   { text-shadow: 0 0 15px var(--neon-pink), 0 0 25px var(--neon-pink), 0 0 35px var(--neon-pink), 0 0 45px var(--neon-purple); }
        }

        .player-container {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(255, 16, 240, 0.3);
            border: 1px solid rgba(255, 16, 240, 0.2);
            backdrop-filter: blur(10px);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 16, 240, 0.2);
        }

        #video-player {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 10px;
            background: #000;
        }

        .video-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(10, 10, 15, 0.98), rgba(10, 10, 15, 0.85));
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 0 0 10px 10px;
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 16, 240, 0.3);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .video-controls.hidden {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        .control-btn {
            background: rgba(255, 16, 240, 0.1);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            padding: 8px 12px;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .control-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
            transform: scale(1.1);
        }

        .control-btn:active { transform: scale(0.95); }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar:hover {
            height: 10px;
            box-shadow: 0 0 10px rgba(255, 16, 240, 0.3);
        }

        .progress-filled {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 10px var(--neon-pink);
            position: relative;
        }

        .progress-filled::after {
            content: '';
            position: absolute;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 12px; height: 12px;
            background: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .time-display {
            color: var(--neon-pink);
            font-size: 0.9rem;
            min-width: 120px;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 5px var(--neon-pink);
            flex-shrink: 0;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .volume-slider {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .volume-slider:hover {
            height: 8px;
            box-shadow: 0 0 8px rgba(255, 16, 240, 0.3);
        }

        .volume-filled {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            border-radius: 3px;
            width: 70%;
            box-shadow: 0 0 8px var(--neon-pink);
        }

        .channel-info {
            display: flex;
            align-items: center;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 16, 240, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 16, 240, 0.2);
        }

        .channel-logo {
            width: 50px; height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 16, 240, 0.3);
        }

        .channel-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            z-index: 10;
        }

        .loading-spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(255, 16, 240, 0.3);
            border-top: 4px solid var(--neon-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 16, 240, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 16, 240, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            right: 15px; top: 50%;
            transform: translateY(-50%);
            color: var(--neon-pink);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 16, 240, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transform: translateY(-2px);
        }

        .channels-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .channel-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 16, 240, 0.3);
            border-color: var(--neon-pink);
        }

        .channel-card.active {
            background: rgba(255, 16, 240, 0.2);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 16, 240, 0.4);
        }

        .channel-card.active::before {
            content: "▶";
            position: absolute;
            left: 10px;
            color: var(--neon-pink);
            font-size: 1.2rem;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .channel-card img {
            width: 60px; height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid rgba(255, 16, 240, 0.5);
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .channel-card:hover img {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 16, 240, 0.5);
        }

        .channel-details {
            flex: 1;
            min-width: 0;
        }

        .channel-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-country {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: var(--neon-pink);
        }

        .no-results {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            grid-column: 1 / -1;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 16, 240, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover, .page-btn.active {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transform: scale(1.1);
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: center;
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            h1 { font-size: 1.8rem; margin-bottom: 15px; }
            .player-container { padding: 15px; margin-bottom: 20px; }
            .video-wrapper { border-radius: 8px; }
            .video-controls { padding: 15px; gap: 10px; flex-wrap: wrap; }
            .control-btn { width: 35px; height: 35px; font-size: 1rem; }
            .progress-bar { order: 3; width: 100%; margin-top: 10px; }
            .time-display { min-width: 80px; font-size: 0.8rem; order: 2; }
            .volume-control { order: 1; }
            .volume-slider { width: 60px; }
            .channel-info { padding: 10px; }
            .channel-logo { width: 40px; height: 40px; }
            .channel-name { font-size: 1rem; }
            .controls { flex-direction: column; gap: 15px; }
            .search-container { width: 100%; min-width: auto; }
            .search-input { padding: 12px 40px 12px 15px; font-size: 0.9rem; }
            .filter-buttons { width: 100%; justify-content: center; }
            .filter-btn { padding: 8px 15px; font-size: 0.8rem; }
            .channels-container { grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
            .channel-card { padding: 12px; }
            .channel-card img { width: 50px; height: 50px; margin-right: 12px; }
            .channel-title { font-size: 0.9rem; }
            .channel-country { font-size: 0.7rem; }
            .pagination { margin-top: 20px; gap: 5px; }
            .page-btn { width: 35px; height: 35px; font-size: 0.8rem; }
            .error-message { font-size: 0.9rem; padding: 8px; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .player-container { padding: 10px; }
            .video-controls { padding: 10px; }
            .control-btn { width: 30px; height: 30px; font-size: 0.9rem; }
            .time-display { font-size: 0.7rem; min-width: 70px; }
            .volume-slider { width: 50px; }
            .channel-info { padding: 8px; }
            .channel-logo { width: 35px; height: 35px; }
            .channel-name { font-size: 0.9rem; }
            .search-input { padding: 10px 35px 10px 12px; font-size: 0.85rem; }
            .filter-btn { padding: 6px 12px; font-size: 0.75rem; }
            .channel-card { padding: 10px; }
            .channel-card img { width: 45px; height: 45px; margin-right: 10px; }
            .channel-title { font-size: 0.85rem; }
            .channel-country { font-size: 0.65rem; }
            .page-btn { width: 30px; height: 30px; font-size: 0.7rem; }
        }
    </style>
</head>

        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let video;
        let hls = null;
        let channels = [];
        let filteredChannels = [];
        let currentPage = 1;
        const channelsPerPage = 24;
        let currentChannel = null;
        let activeFilter = 'all';
        let searchTerm = '';
        let controlsVisible = true;
        let controlsTimeout = null;
        let loadingTimeout = null;

        // ============================================================
        // INITIALISATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            initializePlayer();
            parseM3U();
            setupEventListeners();
        });

        function initializePlayer() {
            video = document.getElementById('video-player');
            setupVideoControls();
            updateVolumeIcon(video.volume);
        }

        function setupVideoControls() {
            const playPauseBtn = document.getElementById('play-pause-btn');
            const progressBar = document.getElementById('progress-bar');
            const volumeSlider = document.getElementById('volume-slider');
            const volumeBtn = document.getElementById('volume-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const hideControlsBtn = document.getElementById('hide-controls-btn');
            const videoWrapper = document.getElementById('video-wrapper');

            playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });
            video.addEventListener('click', togglePlayPause);

            video.addEventListener('timeupdate', updateProgress);
            progressBar.addEventListener('click', (e) => { e.stopPropagation(); seek(e); });

            volumeSlider.addEventListener('click', (e) => { e.stopPropagation(); changeVolume(e); });
            volumeBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

            fullscreenBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
            hideControlsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleControlsVisibility(); });

            video.addEventListener('loadedmetadata', updateTimeDisplay);
            video.addEventListener('timeupdate', updateTimeDisplay);

            videoWrapper.addEventListener('mousemove', showControlsTemporarily);
            videoWrapper.addEventListener('mouseleave', () => { if (!video.paused) scheduleHideControls(); });

            video.addEventListener('pause', () => showControls());
            video.addEventListener('play', () => scheduleHideControls());
            video.addEventListener('playing', () => showLoading(false));
        }

        function togglePlayPause() {
            const icon = document.querySelector('#play-pause-btn i');
            if (video.paused) {
                video.play().catch(err => {
                    console.error('Erreur de lecture:', err);
                    showError('Impossible de lancer la lecture');
                });
                icon.className = 'fas fa-pause';
            } else {
                video.pause();
                icon.className = 'fas fa-play';
            }
        }

        function updateProgress() {
            const progressFilled = document.getElementById('progress-filled');
            if (video.duration && isFinite(video.duration)) {
                const percent = (video.currentTime / video.duration) * 100;
                progressFilled.style.width = percent + '%';
            }
        }

        function seek(e) {
            if (!video.duration || !isFinite(video.duration)) return;
            const progressBar = document.getElementById('progress-bar');
            const rect = progressBar.getBoundingClientRect();
            const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            video.currentTime = percent * video.duration;
        }

        function changeVolume(e) {
            const volumeSlider = document.getElementById('volume-slider');
            const volumeFilled = document.getElementById('volume-filled');
            const rect = volumeSlider.getBoundingClientRect();
            const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            video.volume = percent;
            video.muted = false;
            volumeFilled.style.width = (percent * 100) + '%';
            updateVolumeIcon(percent);
        }

        function toggleMute() {
            video.muted = !video.muted;
            updateVolumeIcon(video.muted ? 0 : video.volume);
        }

        function updateVolumeIcon(volume) {
            const volumeBtn = document.querySelector('#volume-btn i');
            const volumeFilled = document.getElementById('volume-filled');
            if (video.muted || volume === 0) {
                volumeBtn.className = 'fas fa-volume-mute';
                volumeFilled.style.width = '0%';
            } else if (volume < 0.5) {
                volumeBtn.className = 'fas fa-volume-down';
            } else {
                volumeBtn.className = 'fas fa-volume-up';
            }
            if (!video.muted) {
                volumeFilled.style.width = (video.volume * 100) + '%';
            }
        }

        function toggleFullscreen() {
            const videoWrapper = document.querySelector('.video-wrapper');
            if (!document.fullscreenElement) {
                (videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen || videoWrapper.msRequestFullscreen).call(videoWrapper);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
            }
        }

        function showControls() {
            const videoControls = document.getElementById('video-controls');
            const hideControlsBtn = document.querySelector('#hide-controls-btn i');
            controlsVisible = true;
            videoControls.classList.remove('hidden');
            hideControlsBtn.className = 'fas fa-eye-slash';
            clearTimeout(controlsTimeout);
        }

        function hideControls() {
            const videoControls = document.getElementById('video-controls');
            const hideControlsBtn = document.querySelector('#hide-controls-btn i');
            controlsVisible = false;
            videoControls.classList.add('hidden');
            hideControlsBtn.className = 'fas fa-eye';
        }

        function toggleControlsVisibility() {
            if (controlsVisible) { hideControls(); }
            else { showControls(); scheduleHideControls(); }
        }

        function showControlsTemporarily() {
            if (!controlsVisible) {
                document.getElementById('video-controls').classList.remove('hidden');
            }
            clearTimeout(controlsTimeout);
            scheduleHideControls();
        }

        function scheduleHideControls() {
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (!video.paused && controlsVisible) hideControls();
            }, 3000);
        }

        function updateTimeDisplay() {
            const timeDisplay = document.getElementById('time-display');
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // ============================================================
        // PARSING M3U
        // ============================================================
        function parseM3U() {
            const lines = m3uData.split('\n');
            let channel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('#EXTINF')) {
                    channel = {};
                    const nameMatch = line.match(/,(.+)$/);
                    channel.name = nameMatch ? nameMatch[1].trim() : 'Inconnu';

                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    channel.logo = logoMatch ? logoMatch[1] : generatePlaceholder(channel.name);

                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    channel.group = groupMatch ? groupMatch[1].trim() : '';

                    // Extraction du pays via tvg-id="...@XX" ou fallback
                    const idMatch = line.match(/tvg-id="([^"]+)"/);
                    if (idMatch) {
                        const idParts = idMatch[1].split('@');
                        if (idParts.length > 1) {
                            channel.country = idParts[1];
                        } else {
                            const countryMatch = idMatch[1].match(/\.([a-z]{2})$/i);
                            channel.country = countryMatch ? countryMatch[1].toUpperCase() : 'International';
                        }
                    } else {
                        channel.country = 'International';
                    }

                    channel.categories = channel.group
                        ? channel.group.split(';').map(c => c.trim().toLowerCase()).filter(Boolean)
                        : ['undefined'];
                } else if (!line.startsWith('#') && channel) {
                    channel.url = line;
                    channels.push(channel);
                    channel = null;
                }
            }

            filteredChannels = [...channels];
            buildFilterButtons();
            displayChannels();
        }

        function generatePlaceholder(name) {
            const letter = (name || '?').charAt(0).toUpperCase();
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect width='60' height='60' rx='30' fill='%239d00ff'/><text x='50%25' y='50%25' font-size='24' font-family='sans-serif' font-weight='bold' text-anchor='middle' dy='.35em' fill='%23ffffff'>${letter}</text></svg>`;
            return `data:image/svg+xml,${svg}`;
        }

        // Construction dynamique des boutons de filtre à partir des catégories présentes
        function buildFilterButtons() {
            const container = document.getElementById('filter-buttons');
            const counts = {};
            channels.forEach(ch => {
                ch.categories.forEach(cat => {
                    counts[cat] = (counts[cat] || 0) + 1;
                });
            });

            // Trier par nombre décroissant et ne garder que celles qui ont > 0 chaîne
            const sortedCats = Object.entries(counts)
                .filter(([cat]) => cat !== 'undefined' && cat !== '')
                .sort((a, b) => b[1] - a[1])
                .slice(0, 12); // limiter à 12 filtres visibles

            container.innerHTML = '<button class="filter-btn active" data-filter="all">Toutes</button>';
            sortedCats.forEach(([cat, count]) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = cat;
                btn.textContent = `${capitalize(cat)} (${count})`;
                container.appendChild(btn);
            });
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function displayChannels() {
            const container = document.getElementById('channels-container');
            const startIndex = (currentPage - 1) * channelsPerPage;
            const endIndex = startIndex + channelsPerPage;
            const channelsToShow = filteredChannels.slice(startIndex, endIndex);

            if (channelsToShow.length === 0) {
                container.innerHTML = '<div class="no-results">Aucune chaîne trouvée</div>';
                updatePagination();
                return;
            }

            container.innerHTML = '';
            channelsToShow.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                if (currentChannel && currentChannel.url === channel.url) card.classList.add('active');

                const img = document.createElement('img');
                img.src = channel.logo;
                img.alt = channel.name;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.onerror = null;
                    this.src = generatePlaceholder(channel.name);
                };

                const details = document.createElement('div');
                details.className = 'channel-details';
                const groupLabel = channel.group || 'Non classé';
                details.innerHTML = `
                    <div class="channel-title">${escapeHtml(channel.name)}</div>
                    <div class="channel-country">${escapeHtml(groupLabel)}</div>
                `;

                card.appendChild(img);
                card.appendChild(details);
                card.addEventListener('click', (e) => playChannel(channel, e.currentTarget));
                container.appendChild(card);
            });

            updatePagination();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredChannels.length / channelsPerPage);
            pagination.innerHTML = '';
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('div');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; displayChannels(); } });
            pagination.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    const pageBtn = document.createElement('div');
                    pageBtn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                    pageBtn.textContent = i;
                    pageBtn.addEventListener('click', () => { currentPage = i; displayChannels(); });
                    pagination.appendChild(pageBtn);
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    const dots = document.createElement('div');
                    dots.className = 'page-btn';
                    dots.textContent = '...';
                    pagination.appendChild(dots);
                }
            }

            const nextBtn = document.createElement('div');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; displayChannels(); } });
            pagination.appendChild(nextBtn);
        }

        // ============================================================
        // LECTURE
        // ============================================================
        function playChannel(channel, cardElement) {
            currentChannel = channel;

            document.getElementById('current-logo').src = channel.logo;
            document.getElementById('current-name').textContent = channel.name;
            document.getElementById('error-message').style.display = 'none';

            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if (cardElement) cardElement.classList.add('active');

            showLoading(true);
            destroyHls();
            loadVideo(channel.url);

            document.querySelector('.player-container').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function destroyHls() {
            if (hls) {
                try { hls.destroy(); } catch (e) { console.warn(e); }
                hls = null;
            }
            try {
                video.pause();
                video.removeAttribute('src');
                video.load();
            } catch (e) { /* ignore */ }
        }

        function loadVideo(url) {
            clearTimeout(loadingTimeout);
            loadingTimeout = setTimeout(() => {
                showLoading(false);
                showError('Le flux met trop de temps à répondre');
            }, 15000);

            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(err => {
                    console.error('Erreur de lecture:', err);
                    showError('Erreur lors de la lecture de la chaîne');
                });
            } else if (window.Hls && Hls.isSupported()) {
                hls = new Hls({ debug: false, enableWorker: true, lowLatencyMode: true, backBufferLength: 90 });
                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => {
                        console.error('Erreur de lecture:', err);
                        showError('Erreur lors de la lecture de la chaîne');
                    });
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error('Erreur HLS:', data);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                showError('Erreur réseau — le flux est peut-être indisponible');
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                showError('Erreur média — flux corrompu');
                                break;
                            default:
                                showError('Erreur de chargement du flux');
                                destroyHls();
                                break;
                        }
                    }
                });
            } else {
                showError('Votre navigateur ne supporte pas la lecture de flux HLS');
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
            if (!show) clearTimeout(loadingTimeout);
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
            showLoading(false);
        }

        // ============================================================
        // ÉVÉNEMENTS
        // ============================================================
        function setupEventListeners() {
            document.getElementById('search-input').addEventListener('input', function(e) {
                searchTerm = e.target.value.toLowerCase().trim();
                applyFilters();
            });

            document.getElementById('filter-buttons').addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                applyFilters();
            });
        }

        function applyFilters() {
            filteredChannels = channels.filter(channel => {
                const matchesSearch = !searchTerm ||
                    channel.name.toLowerCase().includes(searchTerm) ||
                    (channel.group || '').toLowerCase().includes(searchTerm);
                const matchesFilter = activeFilter === 'all' || channel.categories.includes(activeFilter);
                return matchesSearch && matchesFilter;
            });
            currentPage = 1;
            displayChannels();
        }
    </script>
